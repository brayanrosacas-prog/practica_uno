<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Registro del alumno</ion-title>
    <ion-button color="primary" size="small" default href="home">Atrás</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Ingresa tus datos</h2>

  <!-- 3. Contenedor visual del mensaje que aparece solo si hay error -->
  <ion-text color="danger" *ngIf="mensajeServidor">
    <p class="ion-text-center"><strong>{{ mensajeServidor }}</strong></p>
  </ion-text>

  <ion-list>
    <ion-item>
      <ion-input
        label="Nombre completo: "
        labelPlacement="floating" 
        [(ngModel)]="usuario.nombre" type ="text"> 
      </ion-input>
    </ion-item>
    
    <ion-item>
      <ion-input
        label="Número de control: "
        labelPlacement="floating" [(ngModel)]="usuario.matricula" type ="text">
      </ion-input>
    </ion-item>
    
    <ion-item>
      <ion-input
        label="Correo electrónico: "
        labelPlacement="floating" [(ngModel)]="usuario.correo" type ="text">
      </ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin-top" (click)="guardarDatos()">
    Guardar
  </ion-button>
  
</ion-content>
